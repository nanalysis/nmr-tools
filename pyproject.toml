[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing", "PySide2.QtCore", "PySide2.QtWidgets"]
known-third-party = ["grpc"]
known-first-party = ["nmr", "tests", "enums", "messages", "spinlab_pb2"]
section-order = ["future", "standard-library", "third-party", "matplotlib", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"matplotlib" = ["matplotlib"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "build-*",
    "submodules",
    "ui_*.py",
    "*_rc.py",
    "pb",
    "*_grpc.py",
]

line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.format]
# Do not change quotes for strings
quote-style = "preserve"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
